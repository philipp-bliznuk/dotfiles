# Terminal
term xterm-256color

# Font
font_family JetBrainsMono Nerd Font Mono
font_size 13.0
# Ligatures on, except under the cursor so the glyph you edit stays readable
disable_ligatures cursor

# Cursor
cursor #b4befe
cursor_text_color background
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Window
hide_window_decorations titlebar-only
# No step resize: macOS rounds a maximized frame down to whole cells and leaves
# a gap at the bottom. Kitty's defaults (placement_strategy center,
# padding_fill_strategy background) absorb the remainder as invisible margins.
resize_in_steps no
remember_window_size yes
confirm_os_window_close 0
macos_option_as_alt yes
enable_audio_bell no

# Behavior
mouse_hide_wait 0.0
strip_trailing_spaces smart
scrollback_lines 10000
scrollback_fill_enlarged_window yes

# Image passthrough (yazi)
allow_hyperlinks yes

# Keys
# Shift+Enter as CSI-u for tmux (extended-keys always): outside the kitty
# keyboard protocol kitty sends a plain CR for it and ignores tmux's request
# to switch (CSI > 4;2 m), so the bytes are sent as text. Apps that enabled
# the kitty protocol themselves get its native encoding.
map shift+enter send_text normal,application \x1b[13;2u

