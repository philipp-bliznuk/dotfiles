# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# Extended keys: Shift+Enter reaches panes as CSI-u. `always`, not `on`: `on`
# forwards only to panes that asked via xterm's CSI > 4;2 m, and tmux 3.8 has
# no entry for the kitty protocol's CSI > 1 u (what opencode sends), so those
# panes stayed in mode 0 and the modifier was stripped. Terminal side: ghostty
# and kitty configs map the chord to the CSI-u bytes.
set -s extended-keys always
set -s extended-keys-format csi-u

# Global settings
set -g prefix C-s
bind C-s send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g editor nvim
set -g history-limit 1000000
set -g renumber-windows on
# external: copy-mode y still reaches the terminal's clipboard (OSC 52); a
# pane's own OSC 52, write or query, is ignored
set -g set-clipboard external
set -g focus-events on
set -g display-panes-time 2000
set -g repeat-time 1000
set -g status-position top
set -g allow-passthrough on

# Pane borders
set -g pane-active-border-style "fg=#a6e3a1,bg=default"
set -g pane-border-style "fg=#6c7086,bg=default"

# Status bar (transparent bg)
set -g status-style "bg=default"
set -g status-justify "absolute-centre"
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[fg=#f38ba8 bold],#{?pane_in_mode,#[fg=#f9e2af bold],#[fg=#a6e3a1 bold]}}  #S"
set -g status-right ""
set -wg automatic-rename on
set -g window-status-format "#[fg=#b4befe] #I:#W#{?window_zoomed_flag, 󰁌,}"
set -g window-status-current-format "#[fg=#fab387] #I:#W#{?window_zoomed_flag, 󰁌,}"
set -g window-status-current-style default

# Message & selection
set -g message-command-style "bg=default,fg=#b4befe"
set -g message-style "bg=default,fg=#b4befe"
set -g mode-style "bg=#313244,fg=#94e2d5"

# Vim navigation
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode (vi style)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel # OSC 52 to the terminal, works over ssh too
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi _ send -X start-of-line
bind -T copy-mode-vi $ send -X end-of-line
bind P paste-buffer
unbind -T copy-mode-vi MouseDragEnd1Pane

# Splits in current dir
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Move windows
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# QoL
bind x kill-pane
bind Tab last-window
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% lazygit
bind t display-popup -E -d "#{pane_current_path}" -w 80% -h 80%
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# TPM bootstrap
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{XDG_DATA_HOME}/tmux/plugins/'
if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect / Continuum
# no @resurrect-capture-pane-contents: scrollback (secrets included) would be
# written to disk every save
# save on prefix S: the plugin's default is prefix C-s, bound after this file
# runs, which would shadow `bind C-s send-prefix` above
set -g @resurrect-save 'S'
set -g @resurrect-processes 'false'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep at bottom)
run -b '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
