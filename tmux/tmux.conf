# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Global settings
set -g prefix C-s
set -g mouse on
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g editor nvim
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g focus-events on
set -g display-panes-time 2000
set -g repeat-time 1000
set -g status-position top
set -g allow-passthrough on

# Pane borders (themed)
set -g pane-active-border-style "fg=$THEME_GREEN,bg=default"
set -g pane-border-style "fg=$THEME_OVERLAY0,bg=default"

# Status bar (themed, transparent bg)
set -g status-style "bg=default"
set -g status-justify "absolute-centre"
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[fg=$THEME_RED bold],#{?pane_in_mode,#[fg=$THEME_YELLOW bold],#[fg=$THEME_GREEN bold]}}  #S"
set -g status-right ""
set -wg automatic-rename on
set -g window-status-format "#[fg=$THEME_LAVENDER] #I:#W#{?window_zoomed_flag, 󰁌,}"
set -g window-status-current-format "#[fg=$THEME_PEACH] #I:#W#{?window_zoomed_flag, 󰁌,}"

# Message & selection (themed)
set -g message-command-style "bg=default,fg=$THEME_LAVENDER"
set -g message-style "bg=default,fg=$THEME_LAVENDER"
set -g mode-style "bg=$THEME_SURFACE0,fg=$THEME_TEAL"

# Vim navigation
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode (vi style)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi _ send -X start-of-line
bind -T copy-mode-vi $ send -X end-of-line
bind P paste-buffer
unbind -T copy-mode-vi MouseDragEnd1Pane

# Splits in current dir
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Move windows
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# QoL
bind x kill-pane
bind Tab last-window
bind t display-popup -E -d "#{pane_current_path}" -w 80% -h 80%
bind T display-popup -E -w 40 -h 12 "theme-switch"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# TPM bootstrap
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{XDG_DATA_HOME}/tmux/plugins/'
if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect / Continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'false'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep at bottom)
run -b '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'
