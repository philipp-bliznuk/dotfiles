# A TOML linter such as https://github.com/tombi-toml/tombi can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 2, 5 ]
sort_by        = "natural"
sort_translit  = true
sort_fallback  = "alphabetical"
linemode       = "size"
show_hidden    = true

[opener]
extract = [
	{ run = 'ouch d -y "$@"', desc = "Extract here with ouch" },
]

[plugin]
prepend_previewers = [
    { url = "*.csv", run = "duckdb" },  
    { url = "*.tsv", run = "duckdb" },  
    { url = "*.parquet", run = "duckdb" },  
    { url = "*.xlsx", run = "duckdb" },  
    { url = "*.md", run = "rich-preview" },
    { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch --show-file-icons" },
    { mime = "{text/*,application/json}", run = 'piper -- bat -p --color=always --theme="Catppuccin Mocha" "$1"' },
    { mime = "application/sqlite3", run = 'piper -- sqlite3 "$1" ".schema --indent"' },
]

prepend_preloaders = [  
  { url = "*.csv", run = "duckdb", multi = false },  
  { url = "*.tsv", run = "duckdb", multi = false },  
  { url = "*.parquet", run = "duckdb", multi = false },
  { url = "*.xlsx", run = "duckdb", multi = false }
]
