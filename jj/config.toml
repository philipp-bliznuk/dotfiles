'$schema' = 'https://jj-vcs.github.io/jj/latest/config-schema.json'

# No [user] here: jj-identity copies the identity git resolves per remote into
# each repo (jj clone, jj init), and a repo set up another way warns on every
# command and cannot push until it is run there. signing.key stays global: an
# empty key makes gpg fail (-u ""), which would abort a clone at its first
# commit, before jj-identity can set the repo's own.

[ui]
default-command = "log"
merge-editor = "vimdiff"  # builtin preset, program swapped below
pager = "delta"
diff-formatter = ":git"

[merge-tools.vimdiff]
program = "nvim"

[signing]
behavior = "own"
backend = "gpg"
key = "90FCB72BBEA3C725!"

[remotes.origin]
auto-track-bookmarks = "*"

[revset-aliases]
"wip()" = "description(exact:'') & mine()"
"immutable_heads()" = "builtin_immutable_heads() | remote_bookmarks(remote=origin)"

[template-aliases]
'format_timestamp(timestamp)' = 'timestamp.ago()'

[aliases]
d = ["diff"]
lg = ["log", "--limit", "20"]
clone = ["util", "exec", "--", "jj-identity", "clone"]
init = ["util", "exec", "--", "jj-identity", "init"]
