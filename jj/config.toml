'$schema' = 'https://jj-vcs.github.io/jj/latest/config-schema.json'

[user]
name = "Philipp Bliznuk"
email = "philipp.bliznuk@gmail.com"

[ui]
default-command = "log"
editor = "nvim"
diff-editor = ":builtin"
merge-editor = "vimdiff"
pager = "delta"
diff-formatter = ":git"

[signing]
behavior = "own"
backend = "gpg"
key = "90FCB72BBEA3C725"

[git]
colocate = true
sign-on-push = false

[remotes.origin]
auto-track-bookmarks = "*"

[revset-aliases]
"wip()" = "description(exact:'') & mine()"
"immutable_heads()" = "builtin_immutable_heads() | remote_bookmarks(remote=origin)"

[template-aliases]
'format_timestamp(timestamp)' = 'timestamp.ago()'

[aliases]
ci = ["commit"]
d = ["diff"]
st = ["status"]
lg = ["log", "--limit", "20"]
